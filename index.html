<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latin Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fff;
      --surface: #f6f6f6;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #2563eb;
      --accent-bg: #eff6ff;
      --radius: 7px;
      --font: 'Inter', system-ui, sans-serif;
      --tbl-head-bg: #e8f0fe;
      --tbl-head-color: #1a3a6b;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 16px 80px; }

    header { max-width: 700px; margin: 0 auto; padding: 44px 0 32px; }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em; }
    header p  { margin-top: 3px; font-size: .8rem; color: var(--muted); }

    /* Search */
    .search-area { max-width: 700px; margin: 0 auto 10px; position: relative; }
    .search-area input {
      width: 100%; padding: 11px 38px 11px 14px;
      font-family: var(--font); font-size: .9375rem;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); outline: none;
      transition: border-color .15s;
    }
    .search-area input:focus { border-color: var(--accent); }
    .search-area input::placeholder { color: #bbb; }
    .clear-btn {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #bbb; font-size: .85rem; display: none; padding: 3px;
    }
    .clear-btn:hover { color: var(--text); }

    /* Autocomplete */
    .autocomplete-box {
      position: absolute; top: calc(100% + 2px); left: 0; right: 0;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.08);
      z-index: 100; display: none; max-height: 220px; overflow-y: auto;
    }
    .ac-item {
      padding: 8px 14px; cursor: pointer; font-size: .875rem;
      display: flex; gap: 10px; align-items: baseline;
    }
    .ac-item:hover, .ac-item.active { background: var(--accent-bg); }
    .ac-item .ac-form { color: var(--text); }
    .ac-item .ac-head { color: var(--muted); font-size: .75rem; }

    .status { max-width: 700px; margin: 0 auto 20px; font-size: .8rem; color: var(--muted); min-height: 18px; }

    /* Results list */
    #results { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }

    .entry { animation: slideUp .17s ease both; }
    @keyframes slideUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion:reduce) { .entry { animation:none; } }

    .entry-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 6px; }
    .entry-lemma { font-size: 1.4rem; font-weight: 600; letter-spacing: -.02em; }
    .entry-pos {
      font-size: .65rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-bg); padding: 2px 7px; border-radius: 4px;
    }
    .entry-def { font-size: .9rem; line-height: 1.6; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }

    .forms-label { font-size: .625rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

    /* Tables — compact Wiktionary style */
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 14px; }
    .tbl-title { font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; margin-top: 14px; }
    table { border-collapse: collapse; font-size: .8rem; }
    th, td { border: 1px solid var(--border); padding: 4px 9px; text-align: center; white-space: nowrap; }
    th { background: var(--tbl-head-bg); color: var(--tbl-head-color); font-weight: 600; font-size: .72rem; }
    td.row-label { background: var(--tbl-head-bg); color: var(--tbl-head-color); font-weight: 600; text-align: left; font-size: .72rem; }
    td.empty { color: #ccc; }
    td.span-label { background: var(--surface); color: var(--muted); font-style: italic; font-size: .75rem; }

    /* multi-form cell */
    .mf { display: flex; flex-direction: column; gap: 0; }
    .mf span + span::before { content: ''; display: block; height: 1px; background: var(--border); margin: 2px 0; }

    /* entry divider */
    .entry + .entry { padding-top: 8px; border-top: 2px solid var(--border); }

    footer { max-width: 700px; margin: 48px auto 0; font-size: .72rem; color: #ccc; border-top: 1px solid var(--border); padding-top: 12px; }
  </style>
</head>
<body>

<header>
  <h1>Latin Dictionary</h1>
  <p>Search by any form or lemma — all matching entries are shown.</p>
</header>

<div class="search-area">
  <input type="text" id="search" placeholder="e.g. amor, amorem, puella…" autocomplete="off" spellcheck="false" />
  <button class="clear-btn" id="clearBtn" aria-label="Clear">✕</button>
  <div class="autocomplete-box" id="acBox"></div>
</div>
<div class="status" id="status">Loading…</div>
<div id="results"></div>

<footer>Data: <code>dict.csv</code></footer>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════ */
const CSV_URL = 'dict.csv';

/* ═══════════════════════════════════════════════════════
   SAMPLE DATA
═══════════════════════════════════════════════════════ */
const SAMPLE = `amor,noun_masc,"love; desire; passion"
 amorem,,acc_sg
 amoris,,gen_sg
 amori,,dat_sg
 amore,,abl_sg
 amores,,nom_pl,acc_pl,voc_pl
 amorum,,gen_pl
 amoribus,,dat_pl,abl_pl
puella,noun_fem,"girl; maiden"
 puellam,,acc_sg
 puellae,,gen_sg,dat_sg,nom_pl,voc_pl
 puella,,abl_sg,voc_sg
 puellas,,acc_pl
 puellarum,,gen_pl
 puellis,,dat_pl,abl_pl
bonus,adj_pos,"good; excellent; worthy"
 bonum,,acc_sg_masc,nom_sg_neut,acc_sg_neut
 boni,,gen_sg_masc,nom_pl_masc
 bono,,dat_sg_masc,abl_sg_masc,dat_sg_neut,abl_sg_neut
 bonos,,acc_pl_masc
 bonorum,,gen_pl_masc
 bonis,,dat_pl_masc,abl_pl_masc,dat_pl_fem,abl_pl_fem,dat_pl_neut,abl_pl_neut
 bona,,nom_sg_fem,abl_sg_fem,nom_pl_neut,acc_pl_neut
 bonae,,gen_sg_fem,dat_sg_fem,nom_pl_fem,voc_pl_fem
 bonam,,acc_sg_fem
 bonas,,acc_pl_fem
 bonarum,,gen_pl_fem,gen_pl_neut
 melior,adj_comp,nom_sg_masc,nom_sg_fem
 melius,adj_comp,nom_sg_neut,acc_sg_neut
 optimus,adj_sup,nom_sg_masc
amo,verb,"to love; to be fond of"
 amas,,2sg_pres_ind_act
 amat,,3sg_pres_ind_act
 amamus,,1pl_pres_ind_act
 amatis,,2pl_pres_ind_act
 amant,,3pl_pres_ind_act
 amabam,,1sg_imperf_ind_act
 amabas,,2sg_imperf_ind_act
 amabat,,3sg_imperf_ind_act
 amabamus,,1pl_imperf_ind_act
 amabatis,,2pl_imperf_ind_act
 amabant,,3pl_imperf_ind_act
 amabo,,1sg_fut_ind_act
 amabis,,2sg_fut_ind_act
 amabit,,3sg_fut_ind_act
 amabimus,,1pl_fut_ind_act
 amabitis,,2pl_fut_ind_act
 amabunt,,3pl_fut_ind_act
 amavi,,1sg_perf_ind_act
 amavisti,,2sg_perf_ind_act
 amavit,,3sg_perf_ind_act
 amavimus,,1pl_perf_ind_act
 amavistis,,2pl_perf_ind_act
 amaverunt,,3pl_perf_ind_act
 amem,,1sg_pres_subj_act
 ames,,2sg_pres_subj_act
 amet,,3sg_pres_subj_act
 amemus,,1pl_pres_subj_act
 ametis,,2pl_pres_subj_act
 ament,,3pl_pres_subj_act
 amatur,,3sg_pres_ind_pass
 amantur,,3pl_pres_ind_pass
 amatus,part_pass_perf,nom_sg_masc
`;

/* ═══════════════════════════════════════════════════════
   PARSER
═══════════════════════════════════════════════════════ */
function parseDict(text) {
  const entries = [];
  let current = null;
  for (const raw of text.split('\n')) {
    if (!raw.trim()) continue;
    if (raw[0] === ' ' || raw[0] === '\t') {
      if (!current) continue;
      const parts = splitCSV(raw.trim());
      const form = (parts[0] || '').trim();
      const typeOverride = (parts[1] || '').trim() || null;
      const tags = parts.slice(2).map(t => t.trim()).filter(Boolean);
      if (form) current.forms.push({ form, type: typeOverride, tags });
    } else {
      const parts = splitCSV(raw.trim());
      const lemma = (parts[0] || '').trim();
      const type  = (parts[1] || '').trim();
      const def   = (parts[2] || '').trim();
      if (!lemma) continue;
      current = { lemma, type, definition: def, forms: [] };
      entries.push(current);
    }
  }
  return entries;
}

function splitCSV(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && !inQ) inQ = true;
    else if (c === '"' && inQ) inQ = false;
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

/* ═══════════════════════════════════════════════════════
   INDEX  — form → [entry, …]  (multiple entries per form)
═══════════════════════════════════════════════════════ */
let entries = [];
let formIndex = {}; // form (lc) → Set of entry objects

function addToIndex(key, entry) {
  const k = key.toLowerCase();
  if (!formIndex[k]) formIndex[k] = new Set();
  formIndex[k].add(entry);
}

function buildIndex(parsed) {
  formIndex = {};
  parsed.forEach(entry => {
    addToIndex(entry.lemma, entry);
    entry.forms.forEach(f => addToIndex(f.form, entry));
  });
}

/* ═══════════════════════════════════════════════════════
   TAG MAP  — base_type:tag → [form, …]
   Groups form rows by their effective type, then by tag.
   Returns: { type_string: { tag: [forms] } }
═══════════════════════════════════════════════════════ */
function buildTagMaps(entry) {
  // group forms by their type (use entry.type if form.type is null)
  const byType = {}; // type → { tag → [form] }
  entry.forms.forEach(f => {
    const t = f.type || entry.type;
    if (!byType[t]) byType[t] = {};
    f.tags.forEach(tag => {
      if (!byType[t][tag]) byType[t][tag] = [];
      byType[t][tag].push(f.form);
    });
  });
  return byType;
}

/* ═══════════════════════════════════════════════════════
   RENDER HELPERS
═══════════════════════════════════════════════════════ */
const CASES   = ['nom','gen','dat','acc','abl','voc','loc'];
const CASE_LBL = { nom:'Nominative', gen:'Genitive', dat:'Dative', acc:'Accusative', abl:'Ablative', voc:'Vocative', loc:'Locative' };
const GENDERS = ['masc','fem','neut'];
const GENDER_LBL = { masc:'Masculine', fem:'Feminine', neut:'Neuter' };
const NUMBERS = ['sg','pl'];
const NUMBER_LBL = { sg:'Singular', pl:'Plural' };
const PERSONS = ['1','2','3'];
const PERSON_LBL = { '1':'1st', '2':'2nd', '3':'3rd' };
const TENSES  = ['pres','imperf','fut','perf','pluperf','futperf'];
const TENSE_LBL = { pres:'Present', imperf:'Imperfect', fut:'Future', perf:'Perfect', pluperf:'Pluperfect', futperf:'Fut. Perfect' };
const MOODS   = ['ind','subj','imp'];
const MOOD_LBL = { ind:'Indicative', subj:'Subjunctive', imp:'Imperative' };
const VOICES  = ['act','pass'];
const VOICE_LBL = { act:'Active', pass:'Passive' };

function cell(tagMap, ...keys) {
  const forms = [];
  keys.filter(Boolean).forEach(k => (tagMap[k] || []).forEach(f => { if (!forms.includes(f)) forms.push(f); }));
  if (!forms.length) return '<td class="empty">—</td>';
  if (forms.length === 1) return `<td>${forms[0]}</td>`;
  return `<td><div class="mf">${forms.map(f => `<span>${f}</span>`).join('')}</div></td>`;
}

function hasAny(tagMap, ...keys) {
  return keys.some(k => k && (tagMap[k] || []).length > 0);
}

/* ── Noun table ────────────────────────────────────── */
function renderNoun(tagMap) {
  // detect if gender-tagged (for heteroclite nouns) or plain
  const hasGender = CASES.some(c => GENDERS.some(g => hasAny(tagMap, `${c}_sg_${g}`, `${c}_pl_${g}`)));
  if (hasGender) return renderAdj(tagMap); // reuse adj renderer

  let h = '<table><thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>';
  CASES.forEach(c => {
    if (!hasAny(tagMap, `${c}_sg`, `${c}_pl`)) return;
    h += `<tr><td class="row-label">${CASE_LBL[c]}</td>${cell(tagMap,`${c}_sg`)}${cell(tagMap,`${c}_pl`)}</tr>`;
  });
  h += '</tbody></table>';
  return `<div class="tbl-wrap">${h}</div>`;
}

/* ── Adjective table (genders side by side) ─────── */
function renderAdj(tagMap) {
  // columns: sg_masc, sg_fem, sg_neut, pl_masc, pl_fem, pl_neut
  const cols = [];
  NUMBERS.forEach(n => GENDERS.forEach(g => {
    if (CASES.some(c => hasAny(tagMap, `${c}_${n}_${g}`, `${c}_${n}`))) cols.push({n,g});
  }));
  if (!cols.length) return renderNoun(tagMap); // fallback plain noun

  let h = '<table><thead>';
  // top header: Singular colspan / Plural colspan
  const sgCols = cols.filter(c=>c.n==='sg').length;
  const plCols = cols.filter(c=>c.n==='pl').length;
  h += '<tr><th></th>';
  if (sgCols) h += `<th colspan="${sgCols}">${NUMBER_LBL.sg}</th>`;
  if (plCols) h += `<th colspan="${plCols}">${NUMBER_LBL.pl}</th>`;
  h += '</tr><tr><th></th>';
  cols.forEach(({g}) => h += `<th>${GENDER_LBL[g]}</th>`);
  h += '</tr></thead><tbody>';

  CASES.forEach(c => {
    const keys = cols.map(({n,g}) => `${c}_${n}_${g}`);
    if (!keys.some(k => hasAny(tagMap, k))) return;
    h += `<tr><td class="row-label">${CASE_LBL[c]}</td>`;
    cols.forEach(({n,g}) => { h += cell(tagMap, `${c}_${n}_${g}`); });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return `<div class="tbl-wrap">${h}</div>`;
}

/* ── Verb conjugation table ──────────────────────── */
function renderVerb(tagMap) {
  let html = '';

  // finite forms: group by mood, then voice, then tense
  MOODS.forEach(mood => {
    VOICES.forEach(voice => {
      // find which tenses have data for this mood+voice
      const activeTenses = TENSES.filter(t =>
        PERSONS.some(p => NUMBERS.some(n => hasAny(tagMap, `${p}${n}_${t}_${mood}_${voice}`)))
      );
      if (!activeTenses.length) return;

      html += `<div class="tbl-title">${MOOD_LBL[mood]} — ${VOICE_LBL[voice]}</div>`;
      html += '<div class="tbl-wrap"><table><thead>';
      // header row 1: empty | sg colspan3 | pl colspan3
      html += `<tr><th></th><th colspan="3">${NUMBER_LBL.sg}</th><th colspan="3">${NUMBER_LBL.pl}</th></tr>`;
      // header row 2: tense | 1 2 3 | 1 2 3
      html += '<tr><th></th>';
      [0,1].forEach(() => PERSONS.forEach(p => html += `<th>${PERSON_LBL[p]}</th>`));
      html += '</tr></thead><tbody>';

      activeTenses.forEach(t => {
        html += `<tr><td class="row-label">${TENSE_LBL[t]}</td>`;
        NUMBERS.forEach(n => PERSONS.forEach(p => {
          html += cell(tagMap, `${p}${n}_${t}_${mood}_${voice}`);
        }));
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    });
  });

  return html || '<p style="color:var(--muted);font-size:.85rem">No conjugation data.</p>';
}

/* ── Dispatch by type string ─────────────────────── */
function basePos(type) {
  if (!type) return 'other';
  const t = type.toLowerCase();
  if (t.startsWith('noun')) return 'noun';
  if (t.startsWith('adj'))  return 'adj';
  if (t.startsWith('verb') || t === 'verb') return 'verb';
  if (t.startsWith('part')) return 'adj'; // participles use the adjective table
  return 'other';
}

function posLabel(type) {
  const map = {
    noun_masc:'Noun (m.)', noun_fem:'Noun (f.)', noun_neut:'Noun (n.)',
    adj_pos:'Adj. (positive)', adj_comp:'Adj. (comparative)', adj_sup:'Adj. (superlative)',
    verb:'Verb', part_pass_perf:'Participle (pass. perf.)', part_pres_act:'Participle (pres. act.)',
  };
  return map[type] || type.replace(/_/g,' ');
}

function renderForms(entry) {
  const byType = buildTagMaps(entry);
  let html = '';
  Object.entries(byType).forEach(([type, tagMap]) => {
    const pos = basePos(type);
    const typeLabel = posLabel(type);
    // always label participle groups; label others only when multiple types present
    const isParticiple = type.toLowerCase().startsWith('part');
    const multiType = Object.keys(byType).length > 1;
    if (multiType || isParticiple) html += `<div class="tbl-title" style="margin-top:16px">${typeLabel}</div>`;

    if (pos === 'noun') html += renderNoun(tagMap);
    else if (pos === 'adj') html += renderAdj(tagMap);
    else if (pos === 'verb') html += renderVerb(tagMap);
    else {
      // generic
      html += '<div class="tbl-wrap"><table>';
      Object.entries(tagMap).forEach(([tag, forms]) => {
        html += `<tr><td class="row-label">${tag.replace(/_/g,' ')}</td><td>${forms.join(', ')}</td></tr>`;
      });
      html += '</table></div>';
    }
  });
  return html;
}

/* ═══════════════════════════════════════════════════════
   RENDER ONE ENTRY CARD
═══════════════════════════════════════════════════════ */
function renderEntry(entry) {
  return `<div class="entry">
    <div class="entry-head">
      <span class="entry-lemma">${entry.lemma}</span>
      <span class="entry-pos">${posLabel(entry.type)}</span>
    </div>
    <div class="entry-def">${entry.definition || 'No definition available.'}</div>
    <div class="forms-label">Inflected Forms</div>
    ${renderForms(entry)}
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   SEARCH  — returns all matching entries
═══════════════════════════════════════════════════════ */
function doSearch(query) {
  const q = query.trim().toLowerCase();
  const statusEl  = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  if (!q) {
    statusEl.textContent = `${entries.length} entries loaded.`;
    resultsEl.innerHTML = '';
    return;
  }

  const matched = formIndex[q] ? [...formIndex[q]] : [];
  if (matched.length) {
    statusEl.textContent = `${matched.length} result${matched.length>1?'s':''} for "${query}"`;
    resultsEl.innerHTML = matched.map(renderEntry).join('');
  } else {
    statusEl.textContent = `No entry found for "${query}".`;
    resultsEl.innerHTML = '';
  }
}

/* ═══════════════════════════════════════════════════════
   AUTOCOMPLETE
═══════════════════════════════════════════════════════ */
const MAX_AC = 8;
let acIndex = -1;

function getSuggestions(q) {
  if (!q || q.length < 2) return [];
  const lq = q.toLowerCase();
  // collect matching form→entry pairs, deduplicated by (form, lemma)
  const seen = new Set();
  const results = [];
  for (const [form, entrySet] of Object.entries(formIndex)) {
    if (!form.startsWith(lq)) continue;
    for (const entry of entrySet) {
      const key = form + '|' + entry.lemma;
      if (seen.has(key)) continue;
      seen.add(key);
      results.push({ form, entry });
      if (results.length >= MAX_AC) return results;
    }
  }
  return results;
}

function renderAC(suggestions, q) {
  const box = document.getElementById('acBox');
  if (!suggestions.length) { box.style.display = 'none'; return; }
  box.innerHTML = suggestions.map((s, i) => {
    const hl = s.form.slice(0, q.length) + `<b>${s.form.slice(q.length)}</b>`;
    const head = s.form === s.entry.lemma ? '' : `<span class="ac-head">→ ${s.entry.lemma}</span>`;
    return `<div class="ac-item" data-i="${i}" data-form="${s.form}">
      <span class="ac-form">${hl}</span>${head}
    </div>`;
  }).join('');
  box.style.display = 'block';
  acIndex = -1;
}

function hideAC() { document.getElementById('acBox').style.display = 'none'; acIndex = -1; }

document.getElementById('acBox').addEventListener('mousedown', e => {
  const item = e.target.closest('.ac-item');
  if (!item) return;
  e.preventDefault();
  const form = item.dataset.form;
  document.getElementById('search').value = form;
  hideAC();
  doSearch(form);
});

/* ═══════════════════════════════════════════════════════
   LOAD
═══════════════════════════════════════════════════════ */
async function load() {
  const statusEl = document.getElementById('status');
  let text;
  try {
    const r = await fetch(CSV_URL);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    text = await r.text();
  } catch(e) {
    console.warn('Could not load dict.csv, using sample data.', e);
    text = SAMPLE;
    statusEl.textContent = 'Using sample data — add dict.csv to load your own.';
  }
  entries = parseDict(text);
  buildIndex(entries);
  if (!statusEl.textContent.includes('sample')) {
    statusEl.textContent = `${entries.length} entries loaded.`;
  }
  const q = document.getElementById('search').value;
  if (q.trim()) doSearch(q);
}

/* ═══════════════════════════════════════════════════════
   EVENTS
═══════════════════════════════════════════════════════ */
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
let timer;

searchEl.addEventListener('input', () => {
  const v = searchEl.value;
  clearBtn.style.display = v ? 'block' : 'none';
  renderAC(getSuggestions(v), v.toLowerCase());
  clearTimeout(timer);
  timer = setTimeout(() => doSearch(v), 200);
});

searchEl.addEventListener('keydown', e => {
  const box = document.getElementById('acBox');
  const items = box.querySelectorAll('.ac-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acIndex = Math.min(acIndex + 1, items.length - 1);
    items.forEach((el,i) => el.classList.toggle('active', i === acIndex));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acIndex = Math.max(acIndex - 1, -1);
    items.forEach((el,i) => el.classList.toggle('active', i === acIndex));
  } else if (e.key === 'Enter' && acIndex >= 0) {
    e.preventDefault();
    const form = items[acIndex].dataset.form;
    searchEl.value = form;
    hideAC();
    doSearch(form);
  } else if (e.key === 'Escape') {
    hideAC();
  }
});

searchEl.addEventListener('blur', () => setTimeout(hideAC, 150));
searchEl.addEventListener('focus', () => {
  const v = searchEl.value;
  if (v.length >= 2) renderAC(getSuggestions(v), v.toLowerCase());
});

clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  clearBtn.style.display = 'none';
  hideAC();
  searchEl.focus();
  doSearch('');
});

load();
</script>
</body>
</html>
