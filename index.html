<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latin Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f8f8f8;
      --border: #e5e5e5;
      --text: #1a1a1a;
      --text-secondary: #6b6b6b;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --radius: 8px;
      --font: 'Inter', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 16px 80px;
    }

    header {
      max-width: 680px;
      margin: 0 auto;
      padding: 52px 0 40px;
    }
    header h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
    header p  { margin-top: 4px; font-size: 0.8125rem; color: var(--text-secondary); }

    .search-wrap {
      max-width: 680px;
      margin: 0 auto 16px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      font-family: var(--font);
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input::placeholder { color: #b8b8b8; }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap .clear-btn {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #b8b8b8; font-size: 0.9rem; display: none; padding: 4px;
    }
    .search-wrap .clear-btn:hover { color: var(--text); }

    .status {
      max-width: 680px; margin: 0 auto 28px;
      font-size: 0.8125rem; color: var(--text-secondary); min-height: 20px;
    }

    /* Entry */
    #entry {
      max-width: 680px; margin: 0 auto;
      display: none;
      animation: slideUp 0.18s ease both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { #entry { animation: none; } }

    .entry-head {
      display: flex; align-items: baseline; gap: 10px;
      flex-wrap: wrap; margin-bottom: 8px;
    }
    .entry-lemma { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    .entry-pos {
      font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--accent);
      background: var(--accent-light); padding: 3px 7px; border-radius: 4px;
    }
    .entry-def {
      font-size: 0.9375rem; line-height: 1.6; color: var(--text);
      margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }

    /* Forms table */
    .forms-label {
      font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px;
    }

    /* Noun / Adj table */
    .forms-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left; padding: 8px 14px;
      font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-secondary);
      background: var(--surface); border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      vertical-align: top; color: var(--text);
    }
    td.row-label {
      color: var(--text-secondary); font-weight: 500;
      white-space: nowrap; width: 1%;
    }
    td.empty { color: #ccc; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface); }

    /* multiple forms in one cell */
    .form-list { display: flex; flex-direction: column; gap: 1px; }

    /* Verb: tense sections */
    .verb-section { margin-bottom: 24px; }
    .verb-section-title {
      font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary);
      margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }

    /* Generic tag list fallback */
    .tag-list { display: flex; flex-direction: column; gap: 0; }
    .tag-row {
      display: flex; gap: 16px; padding: 8px 0;
      border-bottom: 1px solid var(--border); font-size: 0.875rem;
    }
    .tag-row:last-child { border-bottom: none; }
    .tag-row .tag { color: var(--text-secondary); font-weight: 500; min-width: 160px; }
    .tag-row .forms-cell { color: var(--text); }

    footer {
      max-width: 680px; margin: 60px auto 0;
      font-size: 0.75rem; color: #c0c0c0;
      border-top: 1px solid var(--border); padding-top: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>Latin Dictionary</h1>
  <p>Search by any form or lemma.</p>
</header>

<div class="search-wrap">
  <input type="text" id="search" placeholder="e.g. amor, amorem, puella…"
         autocomplete="off" spellcheck="false" />
  <button class="clear-btn" id="clearBtn" aria-label="Clear">✕</button>
</div>
<div class="status" id="status">Loading…</div>

<div id="entry" role="region" aria-live="polite"></div>

<footer>Data: <code>dict.csv</code></footer>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const CSV_URL = 'dict.csv';

/* ═══════════════════════════════════════════
   SAMPLE DATA  (fallback when CSV not found)
═══════════════════════════════════════════ */
const SAMPLE = `amor,noun_masc,"love; desire; passion"
 amorem,,acc_sg
 amoris,,gen_sg
 amori,,dat_sg
 amore,,abl_sg
 amores,,nom_pl,acc_pl,voc_pl
 amorum,,gen_pl
 amoribus,,dat_pl,abl_pl
puella,noun_fem,"girl; maiden"
 puellam,,acc_sg
 puellae,,gen_sg,dat_sg,nom_pl,voc_pl
 puella,,abl_sg,voc_sg
 puellas,,acc_pl
 puellarum,,gen_pl
 puellis,,dat_pl,abl_pl
bonus,adj_pos,"good; excellent; worthy"
 bonum,,acc_sg_masc,nom_sg_neut,acc_sg_neut
 boni,,gen_sg_masc,nom_pl_masc
 bono,,dat_sg_masc,abl_sg_masc,dat_sg_neut,abl_sg_neut
 bonos,,acc_pl_masc
 bonorum,,gen_pl_masc
 bonis,,dat_pl_masc,abl_pl_masc
 bona,,nom_sg_fem,abl_sg_fem,nom_pl_neut,acc_pl_neut
 bonae,,gen_sg_fem,dat_sg_fem,nom_pl_fem,voc_pl_fem
 bonam,,acc_sg_fem
 bonas,,acc_pl_fem
 bonarum,,gen_pl_fem
amo,verb,"to love; to be fond of"
 amas,,2sg_pres_act
 amat,,3sg_pres_act
 amamus,,1pl_pres_act
 amatis,,2pl_pres_act
 amant,,3pl_pres_act
 amabam,,1sg_imperf_act
 amabas,,2sg_imperf_act
 amabat,,3sg_imperf_act
 amavi,,1sg_perf_act
 amavisti,,2sg_perf_act
 amavit,,3sg_perf_act
 amavimus,,1pl_perf_act
 amavistis,,2pl_perf_act
 amaverunt,,3pl_perf_act
`;

/* ═══════════════════════════════════════════
   PARSER
   Lines NOT starting with space → head entry:  lemma, type, "definition"
   Lines starting with space    → form row:      _(space)_ form, type_override, tag, tag, …
   type_override is empty string when same as head type
═══════════════════════════════════════════ */
function parseDict(text) {
  // entries: array of { lemma, type, definition, forms: [{form, type, tags:[]}] }
  const entries = [];
  let current = null;

  for (const rawLine of text.split('\n')) {
    if (!rawLine.trim()) continue;

    if (rawLine[0] === ' ' || rawLine[0] === '\t') {
      // form row
      if (!current) continue;
      const parts = splitCSV(rawLine.trim());
      const form = (parts[0] || '').trim();
      const typeOverride = (parts[1] || '').trim() || current.type;
      const tags = parts.slice(2).map(t => t.trim()).filter(Boolean);
      if (form) current.forms.push({ form, type: typeOverride, tags });
    } else {
      // head entry
      const parts = splitCSV(rawLine.trim());
      const lemma = (parts[0] || '').trim();
      const type  = (parts[1] || '').trim();
      const def   = (parts[2] || '').trim();
      if (!lemma) continue;
      current = { lemma, type, definition: def, forms: [] };
      entries.push(current);
    }
  }
  return entries;
}

function splitCSV(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && !inQ) { inQ = true; }
    else if (c === '"' && inQ) { inQ = false; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

/* ═══════════════════════════════════════════
   INDEX
   Maps every form (lowercase) → entry
   Also maps lemma → entry
═══════════════════════════════════════════ */
let entries = [];
let formIndex = {}; // form string → entry

function buildIndex(parsed) {
  formIndex = {};
  parsed.forEach(entry => {
    const lk = entry.lemma.toLowerCase();
    if (!formIndex[lk]) formIndex[lk] = entry;
    entry.forms.forEach(f => {
      const fk = f.form.toLowerCase();
      if (!formIndex[fk]) formIndex[fk] = entry;
    });
  });
}

/* ═══════════════════════════════════════════
   TAG ANALYSIS
   Build: tagMap = { tag: [form, …], … }  from entry.forms
   Then dispatch to the right table renderer.
═══════════════════════════════════════════ */
function buildTagMap(entry) {
  // tag → Set of forms
  const map = {};
  entry.forms.forEach(f => {
    f.tags.forEach(tag => {
      if (!map[tag]) map[tag] = [];
      map[tag].push(f.form);
    });
  });
  return map;
}

/* ═══════════════════════════════════════════
   TABLE RENDERERS
═══════════════════════════════════════════ */

// ── Helpers ──────────────────────────────
const CASES    = ['nom','gen','dat','acc','abl','voc'];
const CASE_LABEL = { nom:'Nom.', gen:'Gen.', dat:'Dat.', acc:'Acc.', abl:'Abl.', voc:'Voc.' };
const NUMBERS  = ['sg','pl'];

function cell(tagMap, ...keys) {
  // keys: try each in order, collect all forms for any that match
  const forms = new Set();
  keys.forEach(k => (tagMap[k] || []).forEach(f => forms.add(f)));
  if (forms.size === 0) return '<td class="empty">—</td>';
  const items = [...forms];
  if (items.length === 1) return `<td>${items[0]}</td>`;
  return `<td><div class="form-list">${items.map(f => `<span>${f}</span>`).join('')}</div></td>`;
}

// ── Noun table (case × number) ────────────
function renderNounTable(tagMap) {
  let html = '<div class="forms-table-wrap"><table>';
  html += '<thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>';
  CASES.forEach(c => {
    html += `<tr><td class="row-label">${CASE_LABEL[c]}</td>`;
    html += cell(tagMap, `${c}_sg`);
    html += cell(tagMap, `${c}_pl`);
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

// ── Adj table (case × number, three genders) ─
const GENDERS = [
  { key: 'masc', label: 'Masculine' },
  { key: 'fem',  label: 'Feminine'  },
  { key: 'neut', label: 'Neuter'    },
];

function renderAdjTable(tagMap) {
  // Detect which genders actually have data
  const activeGenders = GENDERS.filter(g =>
    CASES.some(c => NUMBERS.some(n => (tagMap[`${c}_${n}_${g.key}`] || []).length > 0))
  );
  // Fallback: if no gender-tagged forms, treat like noun
  if (activeGenders.length === 0) return renderNounTable(tagMap);

  // One table per gender
  let html = '';
  activeGenders.forEach(g => {
    html += `<div style="margin-bottom:24px">`;
    html += `<div class="verb-section-title">${g.label}</div>`;
    html += '<div class="forms-table-wrap"><table>';
    html += '<thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>';
    CASES.forEach(c => {
      html += `<tr><td class="row-label">${CASE_LABEL[c]}</td>`;
      html += cell(tagMap, `${c}_sg_${g.key}`);
      html += cell(tagMap, `${c}_pl_${g.key}`);
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  });
  return html;
}

// ── Verb table ────────────────────────────
// Group by tense, rows = person/number, cols = act/pass (if present)
const TENSES = ['pres','imperf','fut','perf','pluperf','futperf'];
const TENSE_LABEL = {
  pres:'Present', imperf:'Imperfect', fut:'Future',
  perf:'Perfect', pluperf:'Pluperfect', futperf:'Future Perfect'
};
const MOODS = ['ind','subj'];
const MOOD_LABEL = { ind: 'Indicative', subj: 'Subjunctive' };
const VOICES = ['act','pass'];
const VOICE_LABEL = { act: 'Active', pass: 'Passive' };
const PERSONS = ['1sg','2sg','3sg','1pl','2pl','3pl'];
const PERSON_LABEL = { '1sg':'1st sg','2sg':'2nd sg','3sg':'3rd sg','1pl':'1st pl','2pl':'2nd pl','3pl':'3rd pl' };

function renderVerbTable(tagMap) {
  // Detect which tense/mood/voice combos have data
  // Tag pattern: person_tense_mood_voice  e.g. 3sg_pres_act  or  2pl_imperf_subj_pass
  // Mood may be omitted (defaults to ind)

  // Collect all tags present
  const allTags = Object.keys(tagMap);

  // For each tense, find moods and voices that appear
  let html = '';
  TENSES.forEach(tense => {
    MOODS.forEach(mood => {
      // Find voices for this tense+mood
      const activeVoices = VOICES.filter(voice =>
        PERSONS.some(p => {
          // try with mood and without (ind is default)
          return tagMap[`${p}_${tense}_${mood}_${voice}`]?.length
              || (mood === 'ind' && tagMap[`${p}_${tense}_${voice}`]?.length);
        })
      );
      if (activeVoices.length === 0) return;

      const moodLabel = `${TENSE_LABEL[tense] || tense} ${MOOD_LABEL[mood] || mood}`;
      html += `<div class="verb-section">`;
      html += `<div class="verb-section-title">${moodLabel}</div>`;
      html += '<div class="forms-table-wrap"><table><thead><tr><th></th>';
      activeVoices.forEach(v => { html += `<th>${VOICE_LABEL[v]}</th>`; });
      html += '</tr></thead><tbody>';

      PERSONS.forEach(p => {
        html += `<tr><td class="row-label">${PERSON_LABEL[p]}</td>`;
        activeVoices.forEach(voice => {
          // accept both tag styles: p_tense_mood_voice and p_tense_voice
          html += cell(tagMap,
            `${p}_${tense}_${mood}_${voice}`,
            mood === 'ind' ? `${p}_${tense}_${voice}` : null
          );
        });
        html += '</tr>';
      });

      html += '</tbody></table></div></div>';
    });
  });

  // Infinitives, imperatives, participles — catch remaining tags as generic list
  const knownPattern = /^(1sg|2sg|3sg|1pl|2pl|3pl)_/;
  const remaining = allTags.filter(t => !knownPattern.test(t));
  if (remaining.length) {
    html += `<div class="verb-section">`;
    html += `<div class="verb-section-title">Other Forms</div>`;
    html += '<div class="tag-list">';
    remaining.forEach(tag => {
      const forms = tagMap[tag].join(', ');
      html += `<div class="tag-row"><span class="tag">${formatTag(tag)}</span><span class="forms-cell">${forms}</span></div>`;
    });
    html += '</div></div>';
  }

  if (!html) html = '<p style="color:var(--text-secondary);font-size:.875rem;">No conjugation data.</p>';
  return html;
}

// ── Generic fallback (tag → forms list) ──
function renderGenericTable(tagMap) {
  const tags = Object.keys(tagMap);
  if (!tags.length) return '<p style="color:var(--text-secondary);font-size:.875rem;">No form data.</p>';
  let html = '<div class="tag-list">';
  tags.forEach(tag => {
    const forms = tagMap[tag].join(', ');
    html += `<div class="tag-row"><span class="tag">${formatTag(tag)}</span><span class="forms-cell">${forms}</span></div>`;
  });
  html += '</div>';
  return html;
}

// Pretty-print a tag string
function formatTag(tag) {
  return tag.replace(/_/g, ' ');
}

/* ═══════════════════════════════════════════
   POS DETECTION & DISPATCH
═══════════════════════════════════════════ */
function basePos(type) {
  if (!type) return 'unknown';
  const t = type.toLowerCase();
  if (t.startsWith('noun')) return 'noun';
  if (t.startsWith('adj'))  return 'adj';
  if (t.startsWith('verb') || t === 'verb') return 'verb';
  if (t.startsWith('part')) return 'verb'; // participles get verb-style
  return 'other';
}

function posLabel(type) {
  const map = {
    noun_masc: 'Noun (m)', noun_fem: 'Noun (f)', noun_neut: 'Noun (n)',
    adj_pos: 'Adjective', adj_com: 'Comparative', adj_sup: 'Superlative',
    verb: 'Verb', part_pass_perf: 'Part. (pass. perf.)',
  };
  return map[type] || type.replace(/_/g, ' ');
}

function renderForms(entry) {
  const tagMap = buildTagMap(entry);
  const pos = basePos(entry.type);
  if (pos === 'noun') return renderNounTable(tagMap);
  if (pos === 'adj')  return renderAdjTable(tagMap);
  if (pos === 'verb') return renderVerbTable(tagMap);
  return renderGenericTable(tagMap);
}

/* ═══════════════════════════════════════════
   RENDER ENTRY
═══════════════════════════════════════════ */
function renderEntry(entry) {
  const el = document.getElementById('entry');
  el.innerHTML = `
    <div class="entry-head">
      <span class="entry-lemma">${entry.lemma}</span>
      <span class="entry-pos">${posLabel(entry.type)}</span>
    </div>
    <div class="entry-def">${entry.definition || 'No definition available.'}</div>
    <div class="forms-label">Inflected Forms</div>
    ${renderForms(entry)}
  `;
  el.style.display = 'block';
}

/* ═══════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════ */
function doSearch(query) {
  const q = query.trim().toLowerCase();
  const statusEl = document.getElementById('status');
  const entryEl  = document.getElementById('entry');

  if (!q) {
    statusEl.textContent = `${entries.length} entries loaded.`;
    entryEl.style.display = 'none';
    return;
  }

  const entry = formIndex[q];
  if (entry) {
    statusEl.textContent = `Showing entry for "${entry.lemma}"`;
    renderEntry(entry);
  } else {
    statusEl.textContent = `No entry found for "${query}".`;
    entryEl.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════
   LOAD
═══════════════════════════════════════════ */
async function load() {
  const statusEl = document.getElementById('status');
  let text;
  try {
    const r = await fetch(CSV_URL);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    text = await r.text();
  } catch (e) {
    console.warn('Could not load dict.csv, using sample data.', e);
    text = SAMPLE;
    statusEl.textContent = 'Using sample data — add dict.csv to load your own.';
  }
  entries = parseDict(text);
  buildIndex(entries);
  if (!statusEl.textContent.includes('sample')) {
    statusEl.textContent = `${entries.length} entries loaded.`;
  }
  const q = document.getElementById('search').value;
  if (q.trim()) doSearch(q);
}

/* ═══════════════════════════════════════════
   EVENTS
═══════════════════════════════════════════ */
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
let timer;

searchEl.addEventListener('input', () => {
  clearBtn.style.display = searchEl.value ? 'block' : 'none';
  clearTimeout(timer);
  timer = setTimeout(() => doSearch(searchEl.value), 180);
});
clearBtn.addEventListener('click', () => {
  searchEl.value = '';
  clearBtn.style.display = 'none';
  searchEl.focus();
  doSearch('');
});

load();
</script>
</body>
</html>
